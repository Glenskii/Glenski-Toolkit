name: Inbox Guardian tests

on:
  push:
    paths:
      - "skills/inbox-guardian-for-gmail/**"
      - ".github/workflows/inbox-guardian-tests.yml"
  pull_request:
    paths:
      - "skills/inbox-guardian-for-gmail/**"
      - ".github/workflows/inbox-guardian-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: skills/inbox-guardian-for-gmail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests -q
